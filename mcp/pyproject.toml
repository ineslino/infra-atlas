[project]
name = "infraatlas-mcp"
version = "0.1.0"
description = "MCP server + CLI for Infra Atlas — query live multi-cloud compute, regions and egress reference data (infraatlas.dev) from any MCP client or the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Inês Lino" }]
keywords = ["mcp", "cloud", "aws", "azure", "gcp", "oci", "ovh", "pricing", "regions"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://infraatlas.dev"
Source = "https://github.com/ineslino/infra-atlas"

[project.scripts]
infraatlas-mcp = "infraatlas_mcp.server:main"
infraatlas = "infraatlas_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infraatlas_mcp"]
