<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Infra Atlas mark — a located point: a node ringed by off-centre topographic contours.
       A contour map (the atlas) · a region pinned and cross-referenced (the node). -->
  <g fill="none" stroke="#FF7849" stroke-width="2.1">
    <circle cx="16" cy="16" r="12.6"/>
    <circle cx="14.8" cy="14.8" r="8.3"/>
    <circle cx="13.6" cy="13.6" r="4.2"/>
  </g>
  <circle cx="13.6" cy="13.6" r="2.6" fill="#FF7849"/>
</svg>
