name: Suggestion or idea
description: A new instrument, a new field, a site feature, or any improvement.
title: "[Idea] "
labels: ["suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome — new instruments, new columns, anything that would make the atlas more useful.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of idea?
      options:
        - New instrument
        - New data or field on an existing instrument
        - Site feature or improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Who is it for, and what does it make easier? Optional.
    validations:
      required: false
