name: Verify freshness

# The curated Cross-Cloud matrices (kubernetes, compliance, confidential-
# computing, iam-matrix, ai-atlas, networking-matrix, egress) and the decisions/ pages are
# hand-maintained from vendor docs and snapshot-dated in the masthead, inside
# a <time datetime="…"> element within .status-time. None pull from a live
# API, so nothing else would catch them silently going stale as time passes.
#
# This job reads each snapshot date and fails when one ages past the review
# threshold — a periodic nudge to re-verify against the vendor docs and bump
# the date. It runs on a schedule only (plus manual dispatch), never on
# push/PR: staleness is caused by time passing, not by a code change, so it
# must not block day-to-day work.

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of each month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Curated snapshot freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check curated snapshot dates
        run: |
          # Curated instruments with a hand-maintained snapshot date, each
          # paired with its staleness threshold in days. The Generative AI
          # Atlas gets a tighter window — model availability moves fast.
          instruments=(
            "kubernetes:180"
            "compliance:180"
            "confidential-computing:180"
            "iam-matrix:180"
            "networking-matrix:180"
            "ai-atlas:45"
            "egress:180"
            "decisions:365"
          )
          now=$(date -u +%s)
          stale=0

          for entry in "${instruments[@]}"; do
            inst="${entry%%:*}"
            threshold="${entry##*:}"
            file="$inst/index.html"
            snapshot=$(grep -oE '<time datetime="[0-9]{4}-[0-9]{2}-[0-9]{2}"' "$file" \
                       | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)

            if [[ -z "$snapshot" ]]; then
              echo "::error file=$file::$inst — no <time datetime> snapshot date found."
              stale=1
              continue
            fi

            age=$(( (now - $(date -u -d "$snapshot" +%s)) / 86400 ))
            if (( age > threshold )); then
              echo "::error file=$file::$inst is stale — snapshot $snapshot is $age days old (threshold ${threshold}). Re-verify against vendor docs and bump the date."
              stale=1
            else
              echo "✓ $inst — snapshot $snapshot, $age days old (threshold ${threshold})"
            fi
          done

          if (( stale )); then
            echo "::error::One or more curated matrices need a freshness review — see annotations above."
            exit 1
          fi
          echo "✓ All curated matrices are within their freshness windows."
