name: Verify data

# Fails the build when an instrument's committed data.json no longer matches the
# data embedded in its index.html. data.json is a generated artifact — regenerate
# it with ./<instrument>/refresh.sh and commit the result.
#
# Scope: instruments whose data.json is built purely from index.html. ec2,
# azure-vm, oci-compute and ovh-instances are excluded — their refresh.sh pulls
# a live external API, so their data.json changes with upstream data and can't
# be checked by re-extraction (the daily "Refresh data" workflow keeps those
# current). When gcp-compute migrates to a live API, drop it from the matrix too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.instrument }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instrument: [regions, gcp-compute, egress]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq python3

      - name: Check data.json is in sync with index.html
        env:
          INST: ${{ matrix.instrument }}
        run: |
          # data.json carries a `generated` timestamp that changes every run;
          # compare everything else against a fresh extraction from index.html.
          before="$(jq -S 'del(.generated)' "$INST/data.json")"
          "./$INST/refresh.sh" >/dev/null
          after="$(jq -S 'del(.generated)' "$INST/data.json")"

          if [[ "$before" != "$after" ]]; then
            echo "::error file=$INST/data.json::$INST/data.json is out of sync with $INST/index.html — run ./$INST/refresh.sh and commit the regenerated data.json."
            echo "▼ committed vs freshly extracted (timestamp ignored):"
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            exit 1
          fi
          echo "✓ $INST/data.json is in sync with $INST/index.html"

  region-drift:
    name: Region drift vs verified reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `regions` instrument is hand-curated — verify-data above only proves
      # data.json was copied faithfully from index.html, never that the region
      # set is correct. This pins it to regions/region-reference.json (a dated,
      # vendor-verified snapshot) so an accidental add/drop/rename fails loudly.
      - name: Check region data against the verified reference
        run: python3 scripts/check_region_drift.py

  mcp-logic:
    name: MCP server logic vs site math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mcp/ mirrors the site's equivalence scoring and egress tier walk in
      # Python. These offline tests pin the known-good numbers (m5.xlarge
      # parity, $912.60 AWS / $1,136.64 GCP for 10 TB, live band wordings) so
      # a drift between the MCP server and the site fails the build.
      - name: Run offline MCP logic tests
        run: python3 mcp/tests/test_logic.py

  landing-stats:
    name: Landing-page stats vs instrument data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The landing page hard-codes a stat chip per instrument card. They are
      # hand-typed and drift from the instruments' data.json (lessons.md L6).
      # This derives the counts and fails if a card chip no longer matches.
      - name: Check landing-page stat chips match data.json
        run: python3 scripts/check_landing_stats.py

      # The hero "N instruments" stat + section header + filter chips are
      # hand-set in static HTML (JS recomputes the first two at runtime, but
      # crawlers / social scrapers / no-JS clients see the static values). This
      # fails if any static count drifts from the real cards — the "21 vs 22"
      # self-report bug the expert panel flagged.
      - name: Check homepage instrument count is in sync
        run: python3 scripts/check_instrument_count.py

      # A smart quote in an attribute (class=”x”) silently breaks the class with
      # no error in the browser — the European Sovereignty card shipped exactly
      # that (metadata run together, CTA floating loose). This fails if any HTML
      # tag contains a typographic quote.
      - name: Check no typographic quotes in HTML attributes
        run: python3 scripts/check_html_attrs.py

      # matrix.css ships only the table; each matrix instrument carries its page
      # chrome in an inline <style>. Data Layer Equivalence shipped with none, so
      # its whole header/filters rendered unstyled. This fails if a matrix page
      # uses class="masthead" but defines no .masthead in an inline <style>.
      - name: Check matrix instrument pages ship their chrome
        run: python3 scripts/check_matrix_chrome.py

      # The social-share card (og.png) hard-codes "N instruments" and silently
      # drifted (shipped "16" while the site had 21). This fails if the OG card
      # no longer matches the live instrument count; fix with build_og.py.
      - name: Check OG social card matches instrument count
        run: python3 scripts/check_og_card.py

      # European Sovereignty tracks a fast-moving topic (EUCS, DPF, sovereign
      # regions). This fails when its "Verified" stamp is older than ~6 months,
      # forcing a re-verification pass against the primary sources.
      - name: Check European Sovereignty freshness
        run: python3 scripts/check_sovereignty_freshness.py

      # The Egress Cost Calculator and the TCO Comparator carry inline
      # mirrors of the egress tier ladders (offline resilience). Mirrors rot
      # (lessons.md L5) — this re-derives every ladder/flat from the
      # canonical egress/data.json and fails on any drift, and pins the
      # calculators' visible "Verified" dates to the Egress Cost Map's stamp.
      - name: Check calculator mirrors match canonical data
        run: python3 scripts/check_calculator_rates.py

      # Each landing card carries a freshness chip ("Refreshed daily" /
      # "Verified <date>"). The chip is hand-typed; the truth lives in each
      # instrument page's <time datetime> stamp. This fails when a snapshot is
      # re-verified (its <time> bumped) but the landing chip wasn't updated.
      - name: Check landing-page freshness chips match instruments
        run: python3 scripts/check_freshness_chips.py
