name: Refresh data

# Runs daily at 06:00 UTC. Every data-driven instrument has a refresh.sh that
# pulls from PUBLIC sources — no cloud account, no credentials, no OIDC.
#  · ec2          → ec2instances.info public dataset (Vantage)
#  · azure-vm     → Azure Retail Prices API (public, no auth)
#  · oci-compute  → Oracle Cloud public price list
#  · ovh-instances→ OVHcloud public order catalogue
#  · gcp-compute  → curated (no credential-free price source)
#  · regions      → curated, regenerated from index.html
# After each refresh, scripts/diff_feed.py diffs the new data.json against the
# instrument's previous refresh and appends change entries to feed.json.
# The APIM instruments (matrix + vendor deep-dives) are static — no refresh.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      instrument:
        description: 'Single instrument to refresh (leave blank for all)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - ec2
          - regions
          - azure-vm
          - gcp-compute
          - oci-compute
          - ovh-instances

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # to commit updated data.json — that is all this needs

jobs:
  refresh:
    name: Refresh ${{ matrix.instrument }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1          # serialise to avoid push races on main
      fail-fast: false
      matrix:
        instrument: [ec2, regions, azure-vm, gcp-compute, oci-compute, ovh-instances]
    steps:
      - name: Skip if a single different instrument was requested
        id: gate
        run: |
          if [[ -n "${{ inputs.instrument }}" && "${{ inputs.instrument }}" != "${{ matrix.instrument }}" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history — the feed diff needs the previous refresh commit

      - if: steps.gate.outputs.run == 'true'
        name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq python3 curl

      - if: steps.gate.outputs.run == 'true'
        name: Refresh ${{ matrix.instrument }}
        run: ./${{ matrix.instrument }}/refresh.sh

      - if: steps.gate.outputs.run == 'true'
        name: Update the What Changed feed
        run: |
          # Baseline = this instrument's PREVIOUS automated refresh, not simply
          # HEAD. A change a human committed between refreshes (a curated new
          # region, a corrected price) is already in HEAD — diffing against HEAD
          # would hide it. Diffing against the last refresh commit catches
          # everything that changed since. A missing baseline (first refresh)
          # is handled by diff_feed, which then skips.
          prev=$(git log -1 --format=%H \
                   --grep="chore(${{ matrix.instrument }}): refresh" \
                   -- "${{ matrix.instrument }}/data.json" || true)
          if [ -n "$prev" ]; then
            git show "$prev:${{ matrix.instrument }}/data.json" > /tmp/prev-data.json 2>/dev/null || true
          else
            : > /tmp/prev-data.json
          fi
          python3 scripts/diff_feed.py "${{ matrix.instrument }}" \
            /tmp/prev-data.json "${{ matrix.instrument }}/data.json" feed.json

      - if: steps.gate.outputs.run == 'true'
        name: Commit and push if changed
        run: |
          git pull --rebase --autostash
          git config user.name "infraatlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ matrix.instrument }}/data.json feed.json
          if git diff --cached --quiet; then
            echo "::notice::${{ matrix.instrument }}: no data changes — skipping commit."
          else
            git commit -m "chore(${{ matrix.instrument }}): refresh data $(date -u +%Y-%m-%d)"
            git push
          fi

  # Rebuild the ⌘K content-search index after the data refresh. Independent
  # of any individual instrument's success — the script reads what is on
  # disk, so even a partial refresh produces a consistent index.
  build-search-index:
    name: Rebuild the search index
    needs: refresh
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3
      - name: Rebuild search-index.json
        run: python3 scripts/build_search_index.py
      - name: Commit if changed
        run: |
          git pull --rebase --autostash
          git config user.name "infraatlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          if git diff --cached --quiet; then
            echo "::notice::search-index.json unchanged — skipping commit."
          else
            git commit -m "chore(search): rebuild index $(date -u +%Y-%m-%d)"
            git push
          fi

  # A scheduled refresh that fails silently is how the data rots unnoticed —
  # surface any failure as a GitHub issue (created once, commented thereafter).
  notify-failure:
    name: Open an issue if the refresh failed
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily data refresh failed"
          body="The daily data refresh failed on $(date -u +%Y-%m-%d). Run log: $RUN_URL"
          existing=$(gh issue list --repo "$REPO" --search "$title in:title" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
