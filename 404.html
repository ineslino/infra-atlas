<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>404 — off the map · Infra Atlas</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0907; --paper: #F4EFE6; --paper-2: rgba(244, 239, 230, 0.66);
    --paper-3: rgba(244, 239, 230, 0.55); --accent: #FF7849;
    --line-2: rgba(244, 239, 230, 0.14);
    --serif: 'Instrument Serif', 'Times New Roman', serif; --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Manrope', -apple-system, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(ellipse at 108% -20%, rgba(255,120,73,0.14), transparent 55%),
      var(--ink);
    color: var(--paper); font-family: var(--sans);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 48px 24px; text-align: center;
  }
  .wrap { max-width: 460px; }
  .mark { width: 40px; height: 40px; margin: 0 auto 28px; display: block; }
  .code {
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 16px;
  }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: 64px;
    line-height: 1.04; letter-spacing: -0.02em; margin-bottom: 18px;
  }
  h1 em { font-style: italic; color: var(--accent); }
  p {
    font-size: 15px; line-height: 1.6; color: var(--paper-2); margin-bottom: 30px;
  }
  a.home {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--paper); text-decoration: none;
    border: 1px solid var(--line-2); border-radius: 99px; padding: 11px 20px;
    transition: border-color .15s, color .15s;
  }
  a.home:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
  <main class="wrap">
    <svg class="mark" viewBox="-116 -116 232 232" aria-hidden="true">
      <path d="M0.00 -100.00L10.72 -25.87L35.36 -35.36L25.87 -10.72L100.00 -0.00L25.87 10.72L35.36 35.36L10.72 25.87L0.00 100.00L-10.72 25.87L-35.36 35.36L-25.87 10.72L-100.00 0.00L-25.87 -10.72L-35.36 -35.36L-10.72 -25.87Z" fill="var(--accent)"/>
    </svg>
    <div class="code">Error 404</div>
    <h1>This page isn't <em>on the map.</em></h1>
    <p>No region, instance type, or instrument answers to that address. It may have been renamed, or it never existed.</p>
    <a class="home" href="/">↑ Back to the Atlas</a>
  </main>
  <script src="/nav.js?v=2" defer></script>
</body>
</html>
